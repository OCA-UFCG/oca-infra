---
# tasks file for role/deploy
- name: Create a directory for the Nginx configuration
  file:
    path: ./nginx
    state: directory

- name: Create a directory for SSL certificates
  file:
    path: ./ssl
    state: directory

- name: Create the oca.conf file for Nginx
  template:
    src: nginx/oca.conf
    dest: ./nginx/oca.conf

- name: Copy SSL certificates
  copy:
    src: "../../../../certs/{{ item }}"
    dest: ./ssl/
  with_items:
    - lsd.pem
    - lsd.key
    - lsd.crt

- name: Create the docker-compose.yml file
  template:
    src: ./docker-compose.yml
    dest: ./docker-compose.yml

- name: Stop and remove existing container if it is running
  docker_container:
    name: "{{ container_name }}"
    state: absent
    force_kill: yes
  ignore_errors: yes
  vars:
    ansible_docker_host: "unix://var/run/docker.sock"

- name: Pull the OCA image
  community.docker.docker_image:
    name: "{{ docker_image }}:latest"
    source: pull

- name: Run Docker Compose up
  become: True
  shell:
    cmd: "docker compose -f ./docker-compose.yml up -d"

- name: Run the OCA container
  community.docker.docker_container:
    name: "{{ container_name }}"
    image: "{{ docker_image }}:latest"
    restart_policy: always
    state: started
    detach: true
    ports:
      - "{{ container_port }}:{{ container_port }}"
    networks:
      - name: oca-network

# Reload do nginx apos renovacao de certificado.
#
# O certbot renova o arquivo em disco, mas o nginx so rele o certificado quando
# recebe um reload. Sem isto, um host pode servir certificado vencido tendo o
# renovado em disco -- foi o que aconteceu com o datane em 2026-09-02.
#
# O diretorio e criado mesmo onde o certbot ainda nao esta instalado: o hook
# fica pronto para quando estiver, e a task e idempotente.
- name: Ensure the certbot deploy-hook directory exists
  ansible.builtin.file:
    path: /etc/letsencrypt/renewal-hooks/deploy
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the nginx reload hook for certbot renewals
  ansible.builtin.template:
    src: letsencrypt/reload-nginx.sh
    dest: /etc/letsencrypt/renewal-hooks/deploy/00-reload-nginx.sh
    owner: root
    group: root
    mode: "0755"
